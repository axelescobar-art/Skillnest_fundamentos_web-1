<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="Axel Escobar">
    <title>Social like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="barra-nav">
            <h1>Social like</h1>
        </nav>
    </header>

    <main class="contenedor">
        <!-- Columna Izquierda -->
        <section class="izquierda">
            <section class="caja">
                <div class="tarjeta">
                    <img src="static/images/misato.png" alt="Foto de perfil" class="foto-perfil">
                    <h3 class="misato">Misato</h3>
                    <button class="botonxd">Mi perfil</button>
                </div>
            </section>
        </section>

        <!-- Columna Derecha -->
        <section class="derecha">
            <section class="title-derecha">
                <h3>Últimas publicaciones</h3>
            </section>

            <!-- Publicación 1 -->
            <section class="publicacion">
                <div class="encabezado-post">
                    <h4>Rei</h4>
                    <div class="likes">
                        <span>0 like(s)</span>
                        <button class="btn-like">Like</button>
                    </div>
                </div>
                <p class="contenido-post">
                    Acabo de configurar este nuevo <a href="https://nekotina.com/es">bot de Discord</a>, cuéntame qué opinan ustedes.
                </p>
            </section>

            <!-- Publicación 2 -->
            <section class="publicacion">
                <div class="encabezado-post">
                    <h4>Asuka</h4>
                    <div class="likes">
                        <span>0 like(s)</span>
                        <button class="btn-like">Like</button>
                    </div>
                </div>
                <p class="contenido-post">
                    Acabo de leer este <a href="#">nuevo cómic</a>. Denle un vistazo.
                </p>
            </section>

            <!-- Publicación 3 -->
            <section class="publicacion">
                <div class="encabezado-post">
                    <h4>Shinji</h4>
                    <div class="likes">
                        <span>0 like(s)</span>
                        <button class="btn-like">Like</button>
                    </div>
                </div>
                <p class="contenido-post">
                    No puedo dejar de escuchar este <a href="#">álbum</a>. ¿A quién más le gusta?
                </p>
            </section>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
