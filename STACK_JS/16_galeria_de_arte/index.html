<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Axel Escobar"
    <title>The Art Gallery</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="navbar">
        <h1 class="logo">The Art Gallery</h1>
        <input type="text" placeholder="Buscar arte..." class="search-input">
        <button class="btn-login">Iniciar sesión</button>
    </header>
    <main class="container">
        <div class="card">
            <div class="img-wrapper">
                <img id="art-image" src="static/images/campo.png" alt="Campo de trigo con cipreses">
            </div>
            <p id="art-title" class="card-title">Campo de trigo con cipreses, Vincent van Gogh (1889)</p>
        </div>
    </main>
    <script src="static/js/script.js" defer></script>
</body>

</html>
