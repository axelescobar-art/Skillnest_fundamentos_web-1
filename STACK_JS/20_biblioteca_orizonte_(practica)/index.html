<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Axel Escobar">
    <title>Tacos Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo-container">
            <img class="logo_taco" src="static/images/logo.png">
            <h1 class="logo">Biblioteca <span class="letra_negra">Horizonte</span></h1>
        </div>
        <div class="actions-container">
            <input type="text" placeholder="Gmail" class="search-input">
                 <button class="btn-login" id="btn-ingresar">Ingresar</button>
            <img class="logo_carrito" src="static/images/carrito.png">
        </div>
    </header>

    <main class="contenedor">
        <section>
            <div class="contenedor_1">
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/enchiladas.jpg" alt="Enchiladas">
                    <p>Enchiladas</p>
                </div>
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/tacos.jpg" alt="Tacos">
                    <p>Tacos</p>
                </div>
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/flautas.jpg" alt="Flautas">
                    <p>Flautas</p>
                </div>
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/gorditas.jpg" alt="Gorditas">
                    <p>Gorditas</p>
                </div>
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/tostadas.jpg" alt="Tostadas">
                    <p>Tostadas</p>
                </div>
                <div class="tarjeta">
                    <img class="imagen_comida" src="static/images/enfrijoladas.jpg" alt="Enfrijoladas">
                    <p>Enfrijoladas</p>
                </div>
            </div>
        </section>

       <section class="seccion-principal">
            
            <!-- Columna Izquierda (Banner y Video) -->
            <div class="contenedor_2">
                <div class="texto-banner">
                    <h2>Descubre nuevas historias</h2>
                    <p>Explora nuestra biblioteca virtual y encuentra libros para todos los gustos.</p>
                </div>
                
                <div class="tarjeta-video">
                    <div class="contenedor-video">
                        <video controls preload="auto" style="width: 100%; height: 100; border-radius: 8px; ">
                            <source src="static/videos/videoxd.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </div> <!-- Cierre de contenedor_2 -->

            <!-- Columna Derecha (Recomendados) -->
            <aside class="recomendados">
                <h3>Libros recomendados:</h3>

                <div class="tarjeta-recomendado">
                    <img src="static/images/tacos.jpg" alt="Cien años de soledad">
                    <p>Cien años de soledad <a href="#">Ver más...</a></p>
                    <button class="btn-sumar">+</button>
                </div>

                <div class="tarjeta-recomendado">
                    <img src="static/images/flautas.jpg" alt="Sapiens">
                    <p>Sapiens <a href="#">Ver más...</a></p>
                    <button class="btn-sumar">+</button>
                </div>

                <div class="tarjeta-recomendado">
                    <img src="static/images/flautas.jpg" alt="El principito">
                    <p>El principito <a href="#">Ver más...</a></p>
                    <button class="btn-sumar">+</button>
                </div>
            </aside>

        </section> <!-- Cierre de seccion-principal -->
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
