<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Axel Escobar">
    <title>Tacos Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo-container">
            <img class="logo_taco" src="static/images/logo.png">
            <h1 class="logo">Taco <span class="letra_negra">Palace</span></h1>
        </div>
        <div class="actions-container">
            <input type="text" placeholder="Gmail" class="search-input">
            <button class="btn-login">Login</button>
            <img class="logo_carrito" src="static/images/carrito.png">
        </div>
    </header>

    <main class="contenedor">
    <section>
        <div class="contenedor_1">
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Enchiladas">
                <p>Enchiladas</p>
            </div>
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Tacos">
                <p>Tacos</p>
            </div>
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Flautas">
                <p>Flautas</p>
            </div>
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Gorditas">
                <p>Gorditas</p>
            </div>
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Tostadas">
                <p>Tostadas</p>
            </div>
            <div class="tarjeta">
                <img class="imagen_comida" src="static/images/comida-mexicana.jpg" alt="Enfrijoladas">
                <p>Enfrijoladas</p>
            </div>
        </div>
        <div class="contenedor_2">

        </div>
    </section>
</main>
    <script src="static/js/script.js"></script>
</body>

</html>
